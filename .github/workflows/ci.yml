name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:  # a newer push to the same branch cancels the run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned to a commit (a tag can be moved to other code); Dependabot proposes updates.
jobs:
  test:
    # Private repos pay for minutes (macOS x10, Windows x2): there the matrix runs only when started by hand.
    # Public repos run it free on every push.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv sync --locked
      - run: uv run pytest -q
  audit:  # known vulnerabilities in the exact dependency versions in uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv export --format requirements-txt --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit --disable-pip -r requirements.txt
  canary:  # the live job sources still answer (maintainers only; never blocks a merge)
    # Private repo: by hand only (the daily app's own fetches show a broken source). Public: each push to main.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv sync
      - run: uv run jobgambit source-test DE "software engineer"
      - run: uv run jobgambit source-test GB "nurse"
